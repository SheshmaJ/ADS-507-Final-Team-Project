# GitHub Actions workflow for pipeline monitoring.

# This workflow provides a one click end to end execution of data pipeline
#using github actions.It runs full ingestion,transformation, and loading,followed
#by monitoring checks to ensure data quality.
#This allows reproducible pipeline execution without local setup.
#It allows pipeline to be triggered manually from github.
#Helps to generate monitoring reports for data quality validation.

name: Pipeline Monitoring

on:
  workflow_dispatch:

jobs:
  pipeline-monitor:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
          MYSQL_USER: ${{ secrets.DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Create .env file
        run: |
          echo DB_USER=${{ env.DB_USER }} > .env
          echo DB_PASSWORD=${{ env.DB_PASSWORD }} >> .env
          echo DB_HOST=${{ env.DB_HOST }} >> .env
          echo DB_PORT=${{ env.DB_PORT }} >> .env
          echo DB_NAME=${{ env.DB_NAME }} >> .env

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..60}; do
            mysql -h "${{ env.DB_HOST }}" -P "${{ env.DB_PORT }}" -u "${{ env.DB_USER }}" -p"${{ env.DB_PASSWORD }}" -e "SELECT 1" "${{ env.DB_NAME }}" && exit 0
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Create schema tables
        run: |
          mysql -h "${{ env.DB_HOST }}" -P "${{ env.DB_PORT }}" -u "${{ env.DB_USER }}" -p"${{ env.DB_PASSWORD }}" "${{ env.DB_NAME }}" < sql/01_create_tables.sql

      - name: Run pipeline (writes monitoring/reports/pipeline.log)
        run: |
          python -m run_pipeline

      - name: Run monitoring checks 
        run: |
          python -m monitoring.run_monitoring
        continue-on-error: true  

      - name: Capture Streamlit screenshot
        run: |
          python -m scripts.capture_dashboard

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: monitoring/reports/
